<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>아파트 시스템 지도</title>
<style>
/* 레이아웃: 한 화면 = 상단 바 + 무한 캔버스(팬·줌) + 오른쪽 근거 패널 + 미니맵. 종이 도면의 톤: 흰 바탕, 검은 선, 이해관계 색만 유채색 */
:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --fg:#16181A; --muted:#5B6168; --line:#D5D9D6; --line2:#E8EAE7; --panel:#FFFFFF; --chip:#EEF0ED; --focus:#1F4E8C;
  --cB:#2F6DB5; --cP:#7B4FA6; --cO:#A87A1E; --cG:#3F8A46; --cR:#C62828; --cT:#1F8A85; --cY:#8A9096; --cK:#3A3F45; --cINS:#B3261E; --crel:#5B6168; --chyp:#9AA0A6; --chub:#C3C8CD;
  --tB:#EAF1FA; --tP:#F2ECF8; --tO:#F8F1E2; --tG:#EAF4EA; --tR:#FBEAEA; --tT:#E6F4F3; --tINS:#FCEAE8; --tNO:#EEEFF0; --tCHK:#F7F6F0;
  --font:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard Variable',Pretendard,'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',system-ui,sans-serif; --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --paper:#1A1D20; --fg:#E8EAEC; --muted:#A3A9B0; --line:#363B40; --line2:#2A2E32; --panel:#1A1D20; --chip:#262A2E; --focus:#8DB4F0;
  --cB:#6FA3E6; --cP:#B394DD; --cO:#D6A94A; --cG:#7CBF82; --cR:#EF7A7A; --cT:#5FC2BC; --cY:#9AA0A6; --cK:#C9CDD1; --cINS:#F08A82; --crel:#9AA0A6; --chyp:#6B7278; --chub:#3A3F45;
  --tB:#1E2A3A; --tP:#2B2238; --tO:#332A17; --tG:#1C2E1E; --tR:#3A1F1F; --tT:#172E2D; --tINS:#3A1F1C; --tNO:#24272A; --tCHK:#2A2823; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --paper:#1A1D20; --fg:#E8EAEC; --muted:#A3A9B0; --line:#363B40; --line2:#2A2E32; --panel:#1A1D20; --chip:#262A2E; --focus:#8DB4F0;
  --cB:#6FA3E6; --cP:#B394DD; --cO:#D6A94A; --cG:#7CBF82; --cR:#EF7A7A; --cT:#5FC2BC; --cY:#9AA0A6; --cK:#C9CDD1; --cINS:#F08A82; --crel:#9AA0A6; --chyp:#6B7278; --chub:#3A3F45;
  --tB:#1E2A3A; --tP:#2B2238; --tO:#332A17; --tG:#1C2E1E; --tR:#3A1F1F; --tT:#172E2D; --tINS:#3A1F1C; --tNO:#24272A; --tCHK:#2A2823; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;overflow:hidden;
  padding-left:max(0px, env(safe-area-inset-left,0px));padding-right:max(0px, env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer;min-height:32px}
button:hover{border-color:var(--fg)} button:focus-visible,input:focus-visible,.node:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button[aria-pressed="true"]:not(.chip){background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="false"]{opacity:.4;border-style:dashed}
input[type=search]{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:5px 10px;min-height:32px;width:220px;max-width:40vw}
#app{display:flex;flex-direction:column;height:100%}
#bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--paper);z-index:5}
#bar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
#bar .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#bar .lbl{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-right:2px}
.chip{padding:3px 9px;min-height:26px;font-size:12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.chip i{width:14px;height:0;border-top:2.5px solid currentColor;display:inline-block}
.chip.d i{border-top-style:dotted}
#main{flex:1;position:relative;min-height:0;display:flex}
#vp{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:var(--bg);
  background-image:radial-gradient(var(--line2) 1px, transparent 1px);background-size:24px 24px}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.region{position:absolute;border:1px solid var(--line);background:var(--paper);border-radius:3px}
.region h2{position:absolute;left:0;top:0;margin:0;padding:10px 14px;font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.01em;white-space:nowrap}
.region.TRANSFER{border-color:var(--cR)} .region.ACTORS{border-color:var(--fg);border-width:2px} .region.TAIL{border-color:var(--cK);border-style:dashed}
.region.HUB{border:none;background:none}
#edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#edges path.e{fill:none;pointer-events:stroke;cursor:pointer;transition:opacity .15s}
#edges path.hit{fill:none;stroke:transparent;stroke-width:14px;pointer-events:stroke;cursor:pointer}
#edges text{font-family:var(--font);font-size:10.5px;fill:var(--muted);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none;display:none}
#world.labels:not(.moving) #edges text{display:block}
#world.moving #edges path.hit{display:none}
#world.moving .node,#world.moving #edges path.e{transition:none}
#edges .dim{opacity:.07}
#edges .sel{filter:drop-shadow(0 0 2px var(--fg))}
.node{position:absolute;background:var(--paper);border:1.6px solid var(--cY);border-radius:4px;padding:7px 10px 8px;cursor:pointer;transition:opacity .15s,box-shadow .15s;user-select:none}
.node:hover{box-shadow:0 0 0 2px var(--line)}
.node.sel{box-shadow:0 0 0 3px var(--focus)}
.node.dim{opacity:.18}
.node .t{font-weight:700;font-size:13px;line-height:1.3;margin:0 0 3px;letter-spacing:-.01em;text-wrap:balance}
.node .l{font-size:11px;line-height:1.45;color:var(--fg);margin:0;font-variant-numeric:tabular-nums}
.node .l.q{color:var(--muted)}
.node .lv{position:absolute;right:8px;top:6px;font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.04em}
.node.study{border-style:dashed} .node.check{border-style:dashed;background:var(--tCHK)} .node.nodata{border-style:dotted;background:var(--tNO);color:var(--muted)} .node.concept{border-style:dotted}
.node.actor{border-width:3px} .node.actor .t{font-size:14px}
.node.hub{background:var(--fg);color:var(--bg);border-color:var(--fg);text-align:center;padding:12px} .node.hub .t{font-size:17px} .node.hub .l{color:var(--bg);opacity:.8}
.node.insight{background:var(--tINS);border-color:var(--cINS);border-radius:999px;padding:9px 16px} .node.insight .t{color:var(--cINS);font-size:12.5px;margin:0} .node.insight .l{display:none}
#panel{width:380px;max-width:100%;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px 18px 32px;display:flex;flex-direction:column;gap:14px;flex-shrink:0}
#panel[hidden]{display:none}
#panel .hd{display:flex;gap:10px;align-items:flex-start}
#panel .hd h2{font-size:17px;margin:0;flex:1;line-height:1.3;text-wrap:balance}
#panel .meta{display:flex;flex-wrap:wrap;gap:6px}
#panel .tag{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:3px;background:var(--chip);color:var(--muted)}
#panel .tag.col{color:var(--paper);background:var(--cc)}
#panel .data{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-variant-numeric:tabular-nums}
#panel .data li{padding:6px 10px;background:var(--chip);border-radius:3px}
#panel h3{font-size:11px;margin:0;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
#panel .src{font-size:13px;margin:0}
#panel .urls{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
#panel .urls a{color:var(--focus);font-size:12.5px;word-break:break-all}
#panel .urls .none{color:var(--muted);font-size:12.5px}
#panel .edges{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
#panel .edges li{display:grid;grid-template-columns:16px 1fr;gap:8px;align-items:start;font-size:12.5px;padding:5px 6px;border-radius:3px;cursor:pointer}
#panel .edges li:hover{background:var(--chip)}
#panel .edges i{display:block;height:0;border-top:2.5px solid var(--ec);margin-top:9px;width:16px} #panel .edges li.d i{border-top-style:dotted}
#panel .edges small{display:block;color:var(--muted)}
#panel .note{font-size:12px;color:var(--muted);margin:0;border-top:1px solid var(--line);padding-top:10px}
#mini{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:260px;height:110px;background:var(--paper);border:1px solid var(--line);border-radius:4px;cursor:crosshair;overflow:hidden;opacity:.95}
#mini svg{display:block;width:100%;height:100%}
#mini .vr{fill:var(--focus);fill-opacity:.12;stroke:var(--focus);stroke-width:1.2px;vector-effect:non-scaling-stroke}
#where{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;max-width:calc(100% - 300px)}
#where b{color:var(--fg);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#where .z{font-family:var(--mono);font-size:11px}
#legend{position:absolute;left:12px;top:12px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px 12px;font-size:11.5px;color:var(--muted);display:grid;grid-template-columns:auto auto;gap:3px 14px;max-width:min(560px, calc(100% - 24px))}
#legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#legend i{width:14px;height:10px;border:1.6px solid var(--c);display:inline-block;border-radius:2px}
#legend i.ln{height:0;border:none;border-top:2.5px solid var(--c)} #legend i.dt{border-top-style:dotted}
#legend[hidden]{display:none}
#srch{position:absolute;left:12px;top:12px;width:300px;max-width:calc(100% - 24px);background:var(--paper);border:1px solid var(--line);border-radius:4px;max-height:50%;overflow:auto;z-index:4}
#srch button{display:block;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line2);border-radius:0;padding:7px 12px;font-size:13px;background:none}
#srch button small{color:var(--muted);display:block;font-size:11px}
#srch button:hover{background:var(--chip)}
@media (max-width:760px){
  #panel{position:absolute;right:0;top:0;bottom:0;width:min(92vw,380px);box-shadow:-8px 0 24px rgba(0,0,0,.15);z-index:6}
  #legend{display:none} #mini{width:160px;height:70px} #where{max-width:calc(100% - 190px)}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>

</head>

<script>
(function(){

  if(n.kind==='node' && !n.color2 && n.verify==='stat'){ const lv=document.createElement('span'); lv.className='lv'; lv.textContent=n.level; d.appendChild(lv); }

/* 마커 */
const markerIds = new Set();
function marker(c, kind){

  let sh;
  if(kind==='circle'){ sh=document.createElementNS('http://www.w3.org/2000/svg','circle'); sh.setAttribute('cx','5'); sh.setAttribute('cy','5'); sh.setAttribute('r','3.5'); sh.setAttribute('fill','var(--paper)'); sh.setAttribute('stroke',col(c)); sh.setAttribute('stroke-width','1.6'); }

  const A=box[a],B=box[b]; const ac={x:A.x+A.w/2,y:A.y+A.h/2}, bc={x:B.x+B.w/2,y:B.y+B.h/2};

const EL = {};
function drawEdges(){
  eg.innerHTML=''; lg.innerHTML='';

    const hit=document.createElementNS('http://www.w3.org/2000/svg','path'); hit.setAttribute('d',d); hit.setAttribute('class','hit'); hit.dataset.e=e.id;

  }
}

/* ---- 팬 · 줌 ---- */
let S=1, TX=0, TY=0;

function zoomAt(f, cx, cy){ const ns=Math.min(3, Math.max(0.1, S*f)); const k=ns/S; TX=cx-(cx-TX)*k; TY=cy-(cy-TY)*k; S=ns; apply(); }

  if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3){ drag.moved=true; vp.classList.add('drag'); } TX=drag.tx+dx; TY=drag.ty+dy; apply(); } });
const up=e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null;
  if(drag && !drag.moved && e.type==='pointerup'){ const tg=drag.target; const nd=tg.closest&&tg.closest('.node'); const ht=tg.closest&&tg.closest('path.hit');
    if(nd) select('n', nd.id.slice(2)); else if(ht) select('e', ht.dataset.e); else clear(); }
  if(pts.size===0){ drag=null; vp.classList.remove('drag'); } };
vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);
$('#zi').onclick=()=>{ const r=vp.getBoundingClientRect(); zoomAt(1.3, r.width/2, r.height/2); };
$('#zo').onclick=()=>{ const r=vp.getBoundingClientRect(); zoomAt(1/1.3, r.width/2, r.height/2); };
$('#fit').onclick=fit;
vp.addEventListener('scroll', ()=>{ if(vp.scrollLeft||vp.scrollTop){ vp.scrollLeft=0; vp.scrollTop=0; } });
vp.addEventListener('keydown', e=>{ if(e.key==='+'||e.key==='=') $('#zi').click(); else if(e.key==='-') $('#zo').click(); else if(e.key==='0') fit(); else if(e.key==='Escape') clear(); });

/* ---- 미니맵 ---- */
const msvg=$('#msvg'); msvg.setAttribute('viewBox',`0 0 ${D.W} ${D.H}`);
let vr;
function buildMini(){
  msvg.innerHTML='';
  for(const r of D.regions){ if(r.bare) continue; const q=document.createElementNS('http://www.w3.org/2000/svg','rect'); q.setAttribute('x',r.x); q.setAttribute('y',r.y); q.setAttribute('width',r.w); q.setAttribute('height',r.h); q.setAttribute('fill','var(--chip)'); q.setAttribute('stroke','var(--line)'); q.setAttribute('stroke-width','6'); msvg.appendChild(q); }
  for(const n of D.nodes){ const b=box[n.id]; const q=document.createElementNS('http://www.w3.org/2000/svg','rect'); q.setAttribute('x',b.x); q.setAttribute('y',b.y); q.setAttribute('width',b.w); q.setAttribute('height',b.h); q.setAttribute('fill', n.kind==='insight'?'var(--cINS)':(n.kind==='hub'?'var(--fg)':col(n.color))); q.setAttribute('fill-opacity', ACT.has(n.id)?'0.9':'0.45'); msvg.appendChild(q); }
  vr=document.createElementNS('http://www.w3.org/2000/svg','rect'); vr.setAttribute('class','vr'); msvg.appendChild(vr);
}
function updateMini(){ if(!vr) return; const r=vp.getBoundingClientRect(); vr.setAttribute('x',-TX/S); vr.setAttribute('y',-TY/S); vr.setAttribute('width',r.width/S); vr.setAttribute('height',r.height/S); }
function miniPt(e){ const r=$('#mini').getBoundingClientRect(); const sc=Math.min(r.width/D.W, r.height/D.H); const ox=(r.width-D.W*sc)/2, oy=(r.height-D.H*sc)/2; return {x:(e.clientX-r.left-ox)/sc, y:(e.clientY-r.top-oy)/sc}; }
let mdrag=false;
$('#mini').addEventListener('pointerdown', e=>{ mdrag=true; $('#mini').setPointerCapture(e.pointerId); const p=miniPt(e); centerOn(p.x,p.y,0,0); e.stopPropagation(); });
$('#mini').addEventListener('pointermove', e=>{ if(!mdrag) return; const p=miniPt(e); centerOn(p.x,p.y,0,0); });
$('#mini').addEventListener('pointerup', ()=>mdrag=false);
function updateWhere(){ const r=vp.getBoundingClientRect(); const cx=(r.width/2-TX)/S, cy=(r.height/2-TY)/S; let best=null;
  for(const g of D.regions){ if(g.bare) continue; if(cx>=g.x&&cx<=g.x+g.w&&cy>=g.y&&cy<=g.y+g.h){ best=g; break; } }
  if(!best){ let dm=1e18; for(const g of D.regions){ if(g.bare) continue; const dx=Math.max(g.x-cx,0,cx-g.x-g.w), dy=Math.max(g.y-cy,0,cy-g.y-g.h); const d=dx*dx+dy*dy; if(d<dm){dm=d;best=g;} } }
  $('#wr').textContent = best ? best.title : '—'; }

/* ---- 범례 · 영역 점프 · 선 필터 ---- */
const legend=$('#legend');
[['B','파랑 · 자금 · 금융'],['P','보라 · 소유 · 자산'],['O','황토 · 공공 권한 · 제도'],['G','초록 · 생산 · 사업 수익'],['R','붉은색 · 비용 · 위험'],['T','청록 · 주거 · 사회적 가치']].forEach(([c,t])=>{ const s=document.createElement('span'); s.innerHTML=`<i style="--c:${col(c)}"></i>${t}`; legend.appendChild(s); });
[['실선 테두리 · 통계','solid'],['파선 · 연구 · 계산','dashed'],['점선 · 수치 없음','dotted']].forEach(([t,st])=>{ const s=document.createElement('span'); s.innerHTML=`<i style="--c:var(--fg);border-style:${st}"></i>${t}`; legend.appendChild(s); });
const sp=document.createElement('span'); sp.innerHTML=`<i style="--c:var(--fg);border-width:3px"></i>굵은 테두리 · 주체 (바탕 = 둘째 이해관계)`; legend.appendChild(sp);
const jump=$('#jump'); jump.innerHTML='<option value="">영역으로 이동…</option>'+D.regions.filter(r=>!r.bare).map(r=>`<option value="${r.id}">${r.title}</option>`).join('');
jump.onchange=()=>{ const r=R[jump.value]; if(!r) return; const v=vp.getBoundingClientRect(); const z=Math.min(v.width/r.w, v.height/r.h)*0.9; centerOn(r.x,r.y,r.w,r.h,Math.min(z,1.2)); jump.value=''; };
const KINDS=[['money','자금','B',false],['val','가치 귀속','P',false],['cost','비용 · 위험','R',false],['pow','권한 · 다음 공급','K',false],['rel','관계 · 정의','rel',false],['hyp','가설','hyp',true],['ins','인사이트 근거','INS',true],['same','같은 주체','hyp',true]];
const on = Object.fromEntries(KINDS.map(k=>[k[0],true])); let solidOnly=false;
for(const [g,t,c,d] of KINDS){ const b=document.createElement('button'); b.className='chip'+(d?' d':''); b.setAttribute('aria-pressed','true'); b.style.color=col(c); b.innerHTML=`<i></i><span style="color:var(--fg)">${t}</span>`; b.onclick=()=>{ on[g]=!on[g]; b.setAttribute('aria-pressed',String(on[g])); refresh(); }; $('#kinds').appendChild(b); }
$('#lgt').onclick=()=>{ const h=!legend.hidden; legend.hidden=h; $('#lgt').setAttribute('aria-pressed',String(!h)); };
$('#solid').onclick=()=>{ solidOnly=!solidOnly; $('#solid').setAttribute('aria-pressed',String(solidOnly)); refresh(); };
let sel=null;
function visible(e){ return on[e.g] && (!solidOnly || e.solid); }
function refresh(){
  const nb = new Set();
  if(sel&&sel.t==='n'){ for(const e of D.edges){ if(e.a===sel.id||e.b===sel.id){ nb.add(e.a); nb.add(e.b);} } }
  for(const e of D.edges){ const p=EL[e.id]; const t=document.getElementById('t-'+e.id); const vis=visible(e); const hide = !vis;
    let dim=false, isSel=false;
    if(sel){ if(sel.t==='n') dim = !(e.a===sel.id||e.b===sel.id); else { isSel = e.id===sel.id; dim = !isSel; } }
    p.style.display=hide?'none':''; e._hit.style.display=hide?'none':''; if(t) t.style.display=(hide||(dim&&!isSel))?'none':'';
    p.classList.toggle('dim',dim); p.classList.toggle('sel',isSel); }
  for(const n of D.nodes){ const el=document.getElementById('n-'+n.id); let dim=false, s=false;
    if(sel){ if(sel.t==='n'){ s = n.id===sel.id; dim = !s && !nb.has(n.id); } else { const e=D.edges.find(x=>x.id===sel.id); s = (n.id===e.a||n.id===e.b); dim=!s; } }
    el.classList.toggle('dim',dim); el.classList.toggle('sel',s); }
}

/* ---- 선택 · 패널 ---- */
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function select(t,id,noMove){
  sel={t,id}; refresh(); panel.hidden=false;
  if(t==='n'){ const n=N[id]; const b=box[id];
    if(!noMove){ const r=vp.getBoundingClientRect(); const inView = (b.x*S+TX>0 && (b.x+b.w)*S+TX<r.width && b.y*S+TY>0 && (b.y+b.h)*S+TY<r.height); if(!inView||S<0.5) centerOn(b.x,b.y,b.w,b.h,Math.max(S,0.9)); }
    try{ if(location.hash!=='#'+id) history.replaceState(null,'','#'+id);}catch(_){ }
    const es=D.edges.filter(e=>e.a===id||e.b===id);
    const groups={}; for(const e of es){ (groups[e.kind]=groups[e.kind]||[]).push(e); }
    const reg=R[n.region];
    panel.innerHTML=`<div class="hd"><h2>${esc(n.title)}</h2><button id="close" aria-label="닫기">✕</button></div>
      <div class="meta">${reg&&reg.title?`<span class="tag">${esc(reg.title)}</span>`:''}
        ${n.kind==='node'?`<span class="tag col" style="--cc:${col(n.color)}">${colName[n.color]}</span>`:''}${n.color2?`<span class="tag col" style="--cc:${col(n.color2)}">${colName[n.color2]}</span>`:''}
        ${n.kind==='node'?`<span class="tag">${verName[n.verify]||n.verify}</span>`:''}<span class="tag">${esc(n.level)}</span></div>
      ${n.lines.length?`<ul class="data">${n.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}
      <h3>출처</h3><p class="src">${esc(n.src)}</p>
      <ul class="urls">${n.urls.length?n.urls.map(u=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,''))}</a></li>`).join(''):'<li class="none">원문 링크 미등록 — 출처 문구로 찾아서 확인 필요</li>'}</ul>
      <h3>연결 ${es.length}</h3>
      ${Object.entries(groups).map(([k,arr])=>`<h3 style="margin-top:4px;text-transform:none;letter-spacing:0;color:var(--fg)">${esc(k)} · ${arr.length}</h3><ul class="edges">${arr.map(e=>{ const other=e.a===id?e.b:e.a; const dir=e.a===id?'→':'←'; return `<li class="${e.d?'d':''}" data-e="${e.id}" style="--ec:${col(e.c)}"><i></i><span>${dir} ${esc(N[other].title)}${e.l?`<small>${esc(e.l)}</small>`:''}</span></li>`; }).join('')}</ul>`).join('')}
      <p class="note">실선은 출처가 그 연결 자체를 보여 주는 것, 점선은 추정. 이 노드의 수치를 확인했거나 원문 링크를 찾았으면 data.json의 <code>${esc(id)}</code> 항목에 적는다.</p>`;
  } else { const e=D.edges.find(x=>x.id===id); const A=N[e.a],B=N[e.b];
    panel.innerHTML=`<div class="hd"><h2>${esc(A.title)} ${e.g==='same'?'·':'→'} ${esc(B.title)}</h2><button id="close" aria-label="닫기">✕</button></div>
      <div class="meta"><span class="tag col" style="--cc:${col(e.c)}">${esc(e.kind)}</span><span class="tag">${e.d?'점선 · 추정 · 조건부':'실선 · 출처가 연결을 보여 줌'}</span>${e.thick?'<span class="tag">굵은 선 · 자금 이동</span>':''}</div>
      ${e.l?`<ul class="data"><li>${esc(e.l)}</li></ul>`:''}
      <h3>양 끝</h3><ul class="edges"><li data-n="${e.a}" style="--ec:${col(A.color||'K')}"><i></i><span>${esc(A.title)}<small>${esc(A.src)}</small></span></li><li data-n="${e.b}" style="--ec:${col(B.color||'K')}"><i></i><span>${esc(B.title)}<small>${esc(B.src)}</small></span></li></ul>
      <p class="note">선의 근거는 양 끝 노드의 출처에 있다. 두 출처가 같은 자료이거나 한쪽이 다른 쪽을 직접 인용하면 실선, 아니면 점선으로 두었다.</p>`;
  }
  $('#close').onclick=clear;
  panel.querySelectorAll('li[data-e]').forEach(li=>li.onclick=()=>{ const e=D.edges.find(x=>x.id===li.dataset.e); const other=e.a===id?e.b:e.a; select('n',other); });
  panel.querySelectorAll('li[data-n]').forEach(li=>li.onclick=()=>select('n',li.dataset.n));
  panel.scrollTop=0;
}
function clear(){ sel=null; panel.hidden=true; refresh(); try{ history.replaceState(null,'',location.pathname+location.search);}catch(_){ } }

/* ---- 검색 ---- */
const q=$('#q'), srch=$('#srch');
q.addEventListener('input', ()=>{ const v=q.value.trim().toLowerCase(); if(!v){ srch.hidden=true; return; }
  const hits=D.nodes.filter(n=>(n.title+' '+n.lines.join(' ')+' '+n.id).toLowerCase().includes(v)).slice(0,30);
  srch.innerHTML=hits.length?hits.map(n=>`<button data-n="${n.id}">${esc(n.title)}<small>${esc((R[n.region]||{}).title||'')} · ${esc(n.lines[0]||'')}</small></button>`).join(''):'<button disabled>없음</button>';
  srch.hidden=false; srch.querySelectorAll('button[data-n]').forEach(b=>b.onclick=()=>{ srch.hidden=true; select('n',b.dataset.n); }); });
q.addEventListener('keydown', e=>{ if(e.key==='Escape'){ q.value=''; srch.hidden=true; } if(e.key==='Enter'){ const b=srch.querySelector('button[data-n]'); if(b) b.click(); } });
document.addEventListener('click', e=>{ if(!e.target.closest('#srch,#q')) srch.hidden=true; });

/* ---- 시작 ---- */
requestAnimationFrame(()=>{ measure(); drawEdges(); buildMini(); fit(); refresh();
  const h=location.hash.replace('#',''); if(h && N[h]) select('n',h);
});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ measure(); drawEdges(); buildMini(); refresh(); });
window.addEventListener('hashchange', ()=>{ const h=location.hash.replace('#',''); if(h&&N[h]) select('n',h); });
window.addEventListener('resize', ()=>{ updateMini(); updateWhere(); });
}
fetch('data.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{ D=j; boot(); }).catch(()=>boot());
})();
</script>

</body>
